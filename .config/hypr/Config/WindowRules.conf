#    ██     ██ ██ ███  ██ ████▄  ▄████▄ ██     ██     █████▄  ██  ██ ██     ██████ ▄█████ 
#    ██ ▄█▄ ██ ██ ██ ▀▄██ ██  ██ ██  ██ ██ ▄█▄ ██ ▄▄▄ ██▄▄██▄ ██  ██ ██     ██▄▄   ▀▀▀▄▄▄ 
#     ▀██▀██▀  ██ ██   ██ ████▀  ▀████▀  ▀██▀██▀      ██   ██ ▀████▀ ██████ ██▄▄▄▄ █████▀  

# [ DEFINED WORKSPACES ]
windowrule = workspace 1, opaque on, focus_on_activate on, no_vrr on, match:class vivaldi-stable
windowrule = workspace 2 silent, match:class discord
windowrule = workspace 3 silent, match:class steam, match:title ^(Steam|Sign in to Steam)$
windowrule = workspace 5 silent, render_unfocused on, match:class obs
windowrule = workspace 6, opaque on, match:class resolve
windowrule = workspace 9 silent, opaque on, match:title ^(.*Minecraft.*)$, match:class ^()$

#    ▄█████ ▄████▄ ██████ ██████  ▄████  ▄████▄ █████▄  ██ ██████ ▄█████ 
#    ██     ██▄▄██   ██   ██▄▄   ██  ▄▄▄ ██  ██ ██▄▄██▄ ██ ██▄▄   ▀▀▀▄▄▄ 
#    ▀█████ ██  ██   ██   ██▄▄▄▄  ▀███▀  ▀████▀ ██   ██ ██ ██▄▄▄▄ █████▀

windowrule {	# [ SCREENSHARING RULES ]
	name = SCREENSHARE
	no_screen_share = on
	match:class = ^(discord|vivaldi-stable)$
}
windowrule {	# [ AUDIO CONTROL ]
	name = MEDIA
	workspace = special:media silent
	match:class = ^(.*easyeffects|pavucontrol-qt)$
}
# [ WAITING FOR MERGE ] windowrule = workspace 9 silent, opaque on, no_dim on, decorate off, fullscreen on, render_unfocused on, match:content 3
windowrule {	# [ WORKSPACE 9 \\ GAMING WORKSPACE ]
  	name = GAMES
	content = game
	workspace = 9 silent
	fullscreen = on
	render_unfocused = on
	match:class = ^.*(steam_app_\d+|cs2|RimWorldLinux|osu!|PrismLauncher|Sober).*$
}
windowrule {	# [ FLOATING WINDOWS - NO FORCED SIZING ]
  	name = FLOAT ONLY 
  	float = on
  	center = on
  	max_size = monitor_w*0.75 monitor_h*0.7
  	match:title = ^(.*Vivaldi Settings.*|OBS Studio Crash Detected|.*1659040.*)$
}
windowrule {	# [ SMALL FLOATING WINDOWS ]
  	name = FLOAT SMALL
  	float = on
  	center = on
  	size = monitor_w*0.2 monitor_h*0.35
  	match:class = ^(blueman-manager|com.network.manager|.*pupgui2|.*share-picker|solaar)$
}
windowrule {	# [ MEDIUM FLOATING WINDOWS ]
  	name = FLOAT MEDIUM 
  	float = on
  	center = on
  	size = monitor_w*0.45 monitor_h*0.5
  	match:class = ^(pavucontrol-qt|.*lsfg|.*xdg-.*|Update|org.kde.ark)$
}
windowrule {	# [ LARGE FLOATING WINDOWS ]
  	name = FLOAT LARGE 
  	float = on
  	center = on
  	size = monitor_w*0.5 monitor_h*0.58
  	match:class = ^(.*dolphin.*|qimgv|mpv|timeshift-gtk|.*easyeffects)$
}

#    ██     ██ ▄████▄ █████▄  ██ ▄█▀ ▄█████ █████▄ ▄████▄ ▄█████ ██████ ▄█████ 
#    ██ ▄█▄ ██ ██  ██ ██▄▄██▄ ████   ▀▀▀▄▄▄ ██▄▄█▀ ██▄▄██ ██     ██▄▄   ▀▀▀▄▄▄ 
#     ▀██▀██▀  ▀████▀ ██   ██ ██ ▀█▄ █████▀ ██     ██  ██ ▀█████ ██▄▄▄▄ █████▀ 

workspace = 1, persistent:true 
workspace = 2, persistent:true 
workspace = 3, persistent:true 
workspace = 4, persistent:true 
workspace = 5, persistent:true 
workspace = 6, persistent:true 
workspace = 7, persistent:true 
workspace = 8, persistent:true 
workspace = 9, persistent:true

workspace = w[tv1]s[false], gapsout:0, gapsin:0
workspace = f[1]s[false], gapsout:0, gapsin:0

windowrule {
	name = WORKSPACE RULES
	opaque = on
	decorate = off
	match:float = 0
	match:workspace = w[tv1]s[false]
}

#    ▄█████▄ ██  ██ ▄████▄ ██     ██ ██████ ██  ██    ▄████▄ ██████   ██     ██ ██████ ██████ 
#    ██ ▄ ██ ██  ██ ██▄▄██ ██     ██   ██    ▀██▀ ▄▄▄ ██  ██ ██▄▄ ▄▄▄ ██     ██ ██▄▄   ██▄▄   
#    ▀█████▀ ▀████▀ ██  ██ ██████ ██   ██     ██      ▀████▀ ██       ██████ ██ ██     ██▄▄▄▄

# [ HYPRLAND 'FIXES' ]
render_unfocused = on
windowrule = suppress_event maximize, match:class .*
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# [ STEAM SUB-WINDOWS ]
windowrule = center on, match:class steam, match:title negative:^()$
windowrule = move 571 166, match:class steam, match:title ^(Steam Settings)$
windowrule = opacity 0, no_focus on, no_blur on, match:title ^(.*AntiCheat.*)$
windowrule = no_dim on, focus_on_activate on, float on, match:class steam, match:initial_title negative:Steam
windowrule = min_size 1 1, allows_input on, pin on, float on, opaque on, no_dim on, match:title ^(.*notificationtoasts.*)$

# [ DOLPHIN SUB-WINDOWS ]
windowrule = min_size 1 1, move (865) (718), size monitor_w*0.3 monitor_h*0.14, match:title ^(.*Copying —.*|.*Folder —.*)$
windowrule = min_size 1 1, move (865) (343), size monitor_w*0.3 monitor_h*0.25, match:title ^(.*Exists —.*|.*Dialog —.*)$

# [ PICTURE-IN-PICTURE // PINNED WINDOWS ]
windowrule = float on, size 640 360, pin on, move (1875) (1035), no_dim on, no_initial_focus on, match:title ^(Picture in picture|Discord Popout)$

# [ CUSTOM FLOATS ]
windowrule = float on, center on, size 780 980, max_size 780 980, min_size 780 980, match:class waypaper
windowrule = workspace 9 silent, opaque on, no_dim on, decorate off, render_unfocused on, content game, match:class .*exe

#    ██     ▄████▄ ██  ██ ██████ █████▄  ▄█████ 
#    ██     ██▄▄██  ▀██▀  ██▄▄   ██▄▄██▄ ▀▀▀▄▄▄ 
#    ██████ ██  ██   ██   ██▄▄▄▄ ██   ██ █████▀ 

# [ OSD | LAYER | LAUNCHER BLUR ]
layerrule = no_anim on, match:namespace selection
layerrule = blur on, blur_popups on, ignore_alpha 0, match:namespace ^(waybar|swaync-notification-window|swayosd|vicinae)$
