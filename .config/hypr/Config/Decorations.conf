#    ████▄  ██████ ▄█████ ▄████▄ █████▄  ▄████▄ ██████ ██ ▄████▄ ███  ██ ▄█████ 
#    ██  ██ ██▄▄   ██     ██  ██ ██▄▄██▄ ██▄▄██   ██   ██ ██  ██ ██ ▀▄██ ▀▀▀▄▄▄ 
#    ████▀  ██▄▄▄▄ ▀█████ ▀████▀ ██   ██ ██  ██   ██   ██ ▀████▀ ██   ██ █████▀ 

# [ WINDOW GAPS & BORDER SIZE ]
general {
    	gaps_in = 10
    	gaps_out = 20
    	border_size = 2
    	resize_on_border = true
    	extend_border_grab_area = 15
	col.inactive_border = rgb($DISABLED)
	col.active_border = rgb($GRADIENT1) rgb($GRADIENT2) 45deg
snap {
    	enabled = true
    	respect_gaps = true
	}
}

# [ WINDOW DECORATIONS ]
decoration {
    	rounding = 0
    	rounding_power = 2
    	active_opacity = 0.95
    	inactive_opacity = 0.85
    	fullscreen_opacity = 1
    	dim_inactive = true
    	dim_strength = 0.5
    	dim_special = 0.5
    	border_part_of_window = true 
	screen_shader =
blur {
        enabled = true
	popups = false 
        size = 8
        passes = 3
	noise = 0.15
        vibrancy = 1
	vibrancy_darkness = 1
	contrast = 1.25
	brightness = 1.5
	popups_ignorealpha = 0.6
	}
shadow {
        enabled = true 
        range = 25
        render_power = 2
	ignore_window = true 
	color = rgba($PRIMARY20)
	color_inactive = rgba($BACKGROUND30)
	}
}

#    ▄████▄ ███  ██ ██ ██▄  ▄██ ▄████▄ ██████ ██ ▄████▄ ███  ██ ▄█████ 
#    ██▄▄██ ██ ▀▄██ ██ ██ ▀▀ ██ ██▄▄██   ██   ██ ██  ██ ██ ▀▄██ ▀▀▀▄▄▄ 
#    ██  ██ ██   ██ ██ ██    ██ ██  ██   ██   ██ ▀████▀ ██   ██ █████▀ 

animations {
    	enabled = 1

# [ ANIMATION VALUES ]
    	bezier = linear,0,0,1,1
    	bezier = bounce,0.7,0.9,0.1,1.05

# [ ANIMATION SETTINGS ]
    	animation = global, 1, 4, bounce 
    	animation = border, 1, 1, linear 
    	animation = windows, 1, 2.5, bounce, popin
    	animation = fade, 1, 1, linear 
    	animation = layers, 1, 2, bounce, popin
    	animation = workspaces, 1, 3.5, bounce, slide 
    	animation = specialWorkspace, 1, 2.5, bounce, slidevert
}
