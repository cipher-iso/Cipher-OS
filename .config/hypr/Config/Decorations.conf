#    ┳┓┏┓┏┓┏┓┳┓┏┓┏┳┓┳┏┓┳┓┏┓
#    ┃┃┣ ┃ ┃┃┣┫┣┫ ┃ ┃┃┃┃┃┗┓
#    ┻┛┗┛┗┛┗┛┛┗┛┗ ┻ ┻┗┛┛┗┗┛ 
# [ GENERAL WINDOW BEHAVIOUR & BORDERS ]
general {
    	gaps_in = 10
    	gaps_out = 20
    	border_size = 2
    	resize_on_border = true
    	extend_border_grab_area = 15
	col.inactive_border = rgb($BACKGROUND)
	col.active_border = rgb($PRIMARY)
	layout = master
snap {
    	enabled = true
    	respect_gaps = true
	}
}

# [ MASTER-WINDOW SIZE ]
master {
	mfact = 0.65
}

# [ WINDOW DECORATIONS ]
decoration {
    	rounding = 0
    	rounding_power = 2
    	active_opacity = 0.9
    	inactive_opacity = 0.85
    	fullscreen_opacity = 1
    	dim_inactive = false 
    	dim_strength = 0.5
    	dim_special = 0.5
    	border_part_of_window = true 
	screen_shader =
blur {
        enabled = true
	popups = false 
        size = 2
        passes = 4
        vibrancy = 1
	vibrancy_darkness = 1
	contrast = 10
	brightness = 1
	popups_ignorealpha = 0.6
	}
shadow {
        enabled = true 
        range = 25
        render_power = 2
	ignore_window = true 
	color = rgba($PRIMARY20)
	color_inactive = rgba($BACKGROUND30)
	}
}

#    ┏┓┳┓┳┳┳┓┏┓┏┳┓┳┏┓┳┓┏┓
#    ┣┫┃┃┃┃┃┃┣┫ ┃ ┃┃┃┃┃┗┓
#    ┛┗┛┗┻┛ ┗┛┗ ┻ ┻┗┛┛┗┗┛
animations {
    	enabled = 1

# [ ANIMATION VALUES ]
    	bezier = linear,     0, 0, 1, 1
    	bezier = bounce,     0.2, 1, 0.2, 1.05
	bezier = boing,	     0.25, 1, 0.25, 1.1

# [ ANIMATION SETTINGS ]
    	animation = global, 		1, 3, 		boing
    	animation = border, 		1, 1, 		linear
    	animation = fade, 		1, 1, 		linear
    	animation = workspaces, 	1, 4, 		bounce, slide
    	animation = windows, 		1, 2, 		boing, popin 15%
    	animation = specialWorkspace, 	1, 2.25, 	boing, slidevert
}
