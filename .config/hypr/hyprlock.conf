general {
	hide_cursor = true
	ignore_empty_input = true
	fail_timeout = 5000
}
background {
    	monitor =
    	path = $HOME/Pictures/Wallpapers/IMG/CiBR/HackerDesk5.png 
    	color = rgba(000, 000, 000, 0.9)
    	noise = 0.05
    	vibrancy = 0.3
	blur_size = 2
	blur_passes = 2
    	brightness = 0.85
}
shape {
	size = 2175, 200
	color = rgba(0, 0, 0, 0.85)
}
shape {
	size = 2175, 1080
	border_size = 80
	border_color = rgba(0, 0, 0, 0.85)
	color = rgba(0, 0, 0, 0)
}
input-field {
    	monitor =
    	size = 1920, 300
    	inner_color = rgba(0, 0, 0, 0)
    	placeholder_text = <b>[ INPUT SIGNAL ]</b>
    	fail_text = <b>ERROR: 404</b>
    	outer_color = rgba(0, 0, 0, 0)
    	outline_thickness = 0
    	check_color=rgba(235, 250, 250, 1)
    	font_family = Barlow 
    	font_color = rgb(000, 255, 64)
    	fail_color=rgba(255, 0, 0, 1)
	swap_font_color = true
    	fade_on_empty = false
    	rounding = 0
    	dots_spacing = 2
    	dots_size = .3
    	dots_rounding = 0
}
