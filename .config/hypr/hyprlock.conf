source = Config/Identifiers.conf	# IDENTIFIERS

general {
	hide_cursor = true
	ignore_empty_input = true
	fail_timeout = 5000
}
background {
    	monitor =
    	color = rgb($BACKGROUND)
}
label {
	font_size = 20
	position = -4%, 0%
	color = rgb($PRIMARY)
	text = <b>INPUT SIGNAL:</b>
	font_family = JetBrainsMono Nerd Font
}
input-field {
    	monitor =
    	size = 10%, 6.5%
	position = 4%, 0%
    	placeholder_text =
    	fail_text = <b>ERROR: 404</b>
    	font_family = JetBrainsMono Nerd Font 
    	rounding = 0
    	dots_size = .2
    	dots_rounding = 0
    	dots_spacing = 0.75
	dots_center = false
    	fade_on_empty = false
	swap_font_color = true
    	outline_thickness = 0
    	fail_color = rgb(255, 0, 0)
    	inner_color = rgb($BACKGROUND)
    	outer_color = rgb($BACKGROUND)
    	font_color = rgb($SECONDARY)
    	check_color = rgb($SECONDARY)
	capslock_color = rgb($SECONDARY)
}
