include ENCOM.conf

shell	zsh
enable_audio_bell	no
scrollback_indicator_opacity 0.0
font_size		14

cursor_trail		3
cursor_shape		beam
cursor_beam_thickness 	2
cursor_shape_unfocused  beam	

placement_strategy top-left
resize_debounce_time 0 0
confirm_os_window_close 0
window_padding_width 20
window_padding_height 20

tab_bar_margin_width      10
tab_bar_margin_height     10 10
tab_bar_style             separator
tab_bar_min_tabs          1
tab_separator             ""
tab_title_template        "{fmt.fg._00ff40}{fmt.bg.default}{fmt.bold}{fmt.fg._000000}{fmt.bg._00ff40}{index}{fmt.fg._000000}{fmt.bg._00ff40} [ {title.upper()} ] {fmt.fg._00ff40}{fmt.bg.default}"
active_tab_title_template "{fmt.fg._00ff40}{fmt.bg.default}{fmt.bold}{fmt.fg._000000}{fmt.bg._00ff40} {fmt.fg._000000}{fmt.bg._00ff40} [ {title.upper()} ] {fmt.fg._00ff40}{fmt.bg.default}"
active_tab_font_style	bold
inactive_tab_foreground	#000
inactive_tab_font_style	bold
inactive_tab_foreground	#000
window_padding_width 30

# NERD FONT
 font_family      family='JetBrainsMono Nerd Font' style=Light
 bold_font        family='JetBrainsMono Nerd Font' style=ExtraBold
 italic_font      family='JetBrainsMono Nerd Font' style='Light Italic'
 bold_italic_font family='JetBrainsMono Nerd Font' style='ExtraBold Italic'

# TERMINAL FONT
# font_family      family="Courier Prime"
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
